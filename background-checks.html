<head>
    <title>Background Checks</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./css/police-deaths.css">
</head>

<body>
    <div id="buttons">
        <a href="./gunfire-deaths.html" class="explore-button" id="explore" onclick="clickButton()"> 2 - Gunfire Deaths </a>
        <a href="./index.html" class="explore-button" id="PoliceDeaths" onclick="clickButton()"> 1 - Police Death Cause </a>
        <a class="explore-button-unselected" id="BackgroundChecks" onclick="clickButton()"> 3 - Background Checks </a>

    </div>


    <h3>Backgound Checks for firearms purchases are increasing which may be reducing police deaths by Gunfire</h3>
    <p><br>Zoom using mouse scroll wheel and hover over chart to see date.
    </p>

    <svg id="scene-3" width="800" height="420"></svg>




    <script>
        var parseDate = d3.timeParse("%Y");

        d3.csv("./data/nicsChecks.csv", ({
                Date,
                Close
            }) => ({
                date: parseDate(Date),
                value: +Close
            }))
            .then(d => chart(d));

        function chart(data) {

            data.sort((a, b) => a.date - b.date);

            var height = 420;

            var svgScene3 = d3.select("#scene-3")
            margin = {
                    top: 15,
                    right: -15,
                    bottom: 50,
                    left: 50
                },
                width = +svgScene3.attr("width") - margin.left - margin.right,
                height = +svgScene3.attr("height") - margin.top - margin.bottom;

            var x = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([margin.left, width - margin.right])

            var y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value)]).nice()
                .range([height - margin.bottom, margin.top])

            var xAxis = svgScene3.append("g")
                .attr("class", "x-axis")
                .attr("clip-path", "url(#clip)")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(x)
                    .tickSizeOuter(0));

            var yAxis = svgScene3.append("g")
                .attr("class", "y-axis")
                .attr("transform", `translate(${margin.left},0)`)
                .call(d3.axisLeft(y));

            var line = d3.line()
                .defined(d => !isNaN(d.value))
                .x(d => x(d.date))
                .y(d => y(d.value))

            var defs = svgScene3.append("defs").append("clipPath")
                .attr("id", "clip")
                .append("rect")
                .attr("x", margin.left)
                .attr("width", width - margin.right)
                .attr("height", height);

            var path = svgScene3.append("path")
                .datum(data)
                .attr("class", "path")
                .attr("fill", "none")
                .attr("clip-path", "url(#clip)")
                .attr("stroke", "steelblue")
                .attr("stroke-width", 1.5)
                .attr("d", line);

            svgScene3.append("text")
                .attr("class", "x label")
                .attr("text-anchor", "end")
                .attr("x", width)
                .attr("y", height, 0)
                .text("Year");

            svgScene3.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "end")
                .attr("y", 0)
                .attr("dy", ".75em")
                .attr("transform", "rotate(-90)")
                .text("Background Checks (millions)");

            svgScene3.call(zoom);

            function zoom(svgScene3) {

                var extent = [
                    [margin.left, margin.top],
                    [width - margin.right, height - margin.top]
                ];

                var zooming = d3.zoom()
                    .scaleExtent([1, 3])
                    .translateExtent(extent)
                    .extent(extent)
                    .on("zoom", zoomed);

                svgScene3.call(zooming);

                function zoomed() {

                    x.range([margin.left, width - margin.right]
                        .map(d => d3.event.transform.applyX(d)));

                    svgScene3.select(".path")
                        .attr("d", line);

                    svgScene3.select(".x-axis")
                        .call(d3.axisBottom(x)
                            .tickSizeOuter(0));
                }
            }

            svgScene3.call(hover)

            function hover() {

                var bisect = d3.bisector(d => d.date).left,
                    format = d3.format("+.0%"),
                    dateFormat = d3.timeFormat("%Y")

                var focus = svgScene3.append("g")
                    .attr("class", "focus")
                    .style("display", "none");

                focus.append("line")
                    .attr("stroke", "#666")
                    .attr("stroke-width", 1)
                    .attr("y1", -height + margin.top)
                    .attr("y2", -margin.bottom);

                focus.append("circle")
                    .attr("class", "circle")
                    .attr("r", 5)
                    .attr("dy", 5)
                    .attr("stroke", "steelblue")
                    .attr("fill", "#fff");

                focus.append("text")
                    .attr("text-anchor", "middle")
                    .attr("dy", ".35em");

                var overlay = svgScene3.append("rect")
                    .attr("class", "overlay")
                    .attr("x", margin.left)
                    .attr("y", margin.top)
                    .attr("width", width - margin.right - margin.left - 1)
                    .attr("height", height - margin.bottom - margin.top)
                    .on("mouseover", () => focus.style("display", null))
                    .on("mouseout", () => focus.style("display", "none"))
                    .on("mousemove", mousemove);

                function mousemove() {

                    var x0 = x.invert(d3.mouse(this)[0]);

                    var i = bisect(data, x0, 1),
                        d0 = data[i - 1],
                        d1 = data[i],
                        d = x0 - d0.date > d1.date - x0 ? d1 : d0;

                    focus.select("line")
                        .attr("transform",
                            "translate(" + x(d.date) + "," + height + ")");

                    focus.selectAll(".circle")
                        .attr("transform",
                            "translate(" + x(d.date) + "," + y(d.value) + ")");

                    focus.select("text")
                        .attr("transform",
                            "translate(" + x(d.date) + "," + (height + margin.bottom) + ")")
                        .text(dateFormat(d.date));
                }


                const type = d3.annotationLabel

                const sceneThreeAnnotations = [{
                    note: {
                        bgPadding: 5,
                        title: "Average Deaths 1983-1992 74 2010-2019 56.3"
                    },
                    className: "show-bg",
                    x: 390,
                    y: 230,
                    dy: 0,
                    dx: 350,
                    subject: {
                        radius: 50,
                        radiusPadding: 5
                    },
                    connector: {
                        lineType: "horizontal"
                    }
                }]

                const makeAnnotations = d3.annotation()
                    .editMode(true)
                    .notePadding(15)
                    .type(type)

                    .annotations(sceneThreeAnnotations)

                d3.select("#scene-3")
                    .append("g")
                    .attr("class", "annotation-group")
                    .call(makeAnnotations)


            }
        }
    </script>
</body>
