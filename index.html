<head>
    <title>Police Deaths By Gunfire and Background Checks</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./css/police-deaths.css">


</head>

<body>
    <div id="buttons">

        <a href="./background-checks.html" class="explore-button" id="explore" onclick="clickButton()"> 3 - Background Checks </a>
        <a href="./gunfire-deaths.html" class="explore-button" id="explore" onclick="clickButton()"> 2 - Gunfire Deaths </a>
        <a class="explore-button-unselected" id="PoliceDeaths" onclick="clickButton()"> 1 - Police Death Cause </a>
    </div>

    <br>
    <br>
    <h2> Are background checks for firearm purchases reducing police deaths by Gunfire?</h2>

    <svg id="scene-1" width="800" height="620"></svg>


    <script>
        const margin = {
                top: 30,
                right: 30,
                bottom: 100,
                left: 100
            },
            width = 660 - margin.left - margin.right,
            height = 600 - margin.top - margin.bottom;

        const svgScene1 = d3.select("#scene-1")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("./data/causeDeath.csv").then(function(data) {

            const x = d3.scaleBand()
                .range([0, width])
                .domain(data.map(d => d.Cause))
                .padding(0.2);
            svgScene1.append("g")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(x))
                .selectAll("text")
                .attr("transform", "translate(-10,0)rotate(-45)")
                .style("text-anchor", "end");


            const y = d3.scaleLinear()
                .domain([0, 15000])
                .range([height, 0]);
            svgScene1.append("g")
                .call(d3.axisLeft(y));

            svgScene1.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "end")
                .attr("y", -60)
                .attr("dy", ".75em")
                .attr("transform", "rotate(-90)")
                .text("Top 20 Causes (1791-2022)");



            svgScene1.selectAll("mybar")
                .data(data)
                .join("rect")
                .attr("x", d => x(d.Cause))
                .attr("y", d => y(d.Value))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(d.Value))
                .attr("fill", "#3258a8")

        })

        const type = d3.annotationLabel

        const sceneOneAnnotations = [{
            note: {
                label: "is the leading cause death",
                bgPadding: 20,
                title: "Gunfire"
            },
            className: "show-bg",
            x: 120,
            y: 85,
            dy: 0,
            dx: 100,
            subject: {
                radius: 150,
                radiusPadding: 100
            },
        }]

        const x = d3.scaleTime().range([0, 800])
        const y = d3.scaleLinear().range([300, 0])

        const makeAnnotations = d3.annotation()
            .editMode(true)

            .notePadding(15)
            .type(type)

            .annotations(sceneOneAnnotations)

        d3.select("#scene-1")
            .append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations)
    </script>


</body>
